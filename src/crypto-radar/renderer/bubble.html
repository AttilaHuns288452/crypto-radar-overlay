<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Radar Bubble</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 32px;
      height: 32px;
      overflow: hidden;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    body {
      position: relative;
    }

    .bubble-button {
      -webkit-app-region: no-drag;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.18), transparent 22%),
        linear-gradient(135deg, rgba(50, 213, 131, 0.95), rgba(104, 167, 255, 0.9)),
        #090b0f;
      box-shadow:
        0 16px 42px rgba(0, 0, 0, 0.48),
        0 0 24px rgba(50, 213, 131, 0.28);
    }

    .close-button {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 12px;
      border: 1px solid rgba(7, 16, 22, 0.4);
      border-radius: 999px;
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      color: #effaf6;
      background: rgba(7, 16, 22, 0.88);
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      opacity: 0.9;
    }

    .close-button:hover {
      opacity: 1;
      background: rgba(24, 55, 44, 0.96);
    }

    .is-dragging .bubble-button {
      cursor: grabbing;
    }

    svg {
      width: 17px;
      height: 17px;
      color: #071016;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.16));
    }
  </style>
</head>
<body>
  <button id="restoreButton" class="bubble-button" title="Open Crypto Radar" aria-label="Open Crypto Radar">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M8 31 18 21l8 7 15-18" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="39" cy="10" r="4.5" fill="currentColor"></circle>
    </svg>
  </button>
  <button id="closeBubbleButton" class="close-button" title="Quit Crypto Radar" aria-label="Quit Crypto Radar">x</button>
  <script type="module" src="../../../dist/crypto-radar/bubble.js"></script>
</body>
</html>
